<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colombian Traffic — Michael T. Smith</title><link rel="stylesheet" href="../style.css"><style>.poem-page{max-width:920px;margin:auto;padding:48px 28px 90px}.poem-page h1{font-size:32px;line-height:1.15;margin:.2em 0 10px}.meta{color:var(--muted);font:14px/1.45 Arial,sans-serif;margin-bottom:8px}.meta-links{margin:10px 0 30px;font:14px/1.45 Arial,sans-serif}.meta-links a{color:var(--green)}.poemtext{font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.58}.src-line{white-space:pre-wrap}.highlight{color:#000 !important}</style></head><body><nav class="site-nav"><div class="wrap nav"><div class="brand">Michael Thomas Smith</div><div><a href="../poetry.html">Poetry</a></div></div></nav><main class="poem-page"><div class="eyebrow">Poem 53</div><h1><span style="font-weight:700;font-style:italic">Colombian Traffic </span></h1><div class="meta"><div>*Published in Bronze Bird Review in 2025 (or 2026).</div></div><div class="poemtext"><div class="src-line" style="margin-bottom:0.0px;line-height:1.500">Colombian traffic is like a traumatic thought</div><div class="src-line" style="margin-bottom:0.0px;line-height:1.500">that never leaves the mind</div><div class="src-line" style="margin-bottom:0.0px;line-height:1.500">but clogs the works, by pushing against </div><div class="src-line" style="margin-bottom:0.0px;line-height:1.500">other thoughts – bumper</div><div class="src-line" style="margin-bottom:0.0px;line-height:1.500">to bumper,</div><div class="src-line" style="margin-bottom:0.0px;line-height:1.500">over and  </div><div class="src-line" style="margin-bottom:0.0px;line-height:1.500">over.</div><div class="src-line" style="margin-bottom:13.33px;line-height:1.150">&nbsp;</div></div><p style="margin-top:42px"><a href="../poetry.html">← Back to Poetry</a></p></main></body></html>
