<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How Terrifying — Michael T. Smith</title><link rel="stylesheet" href="../style.css"></head><body><nav class="site-nav"><div class="wrap nav"><div class="brand">Michael T. Smith</div><div><a href="../index.html">Poetry</a></div></div></nav><main class="wrap"><article class="poem"><div class="eyebrow">Poem 144 of 291</div><h2>How Terrifying</h2><div class="meta">Published in Artvilla, poetry life and times in 2018; Republished Ink Pantry in 2018ish</div><div class="poemtext">How terrifying death is

in the middle of a thought.

My eyes wanted to slam shut

such that they could defend

against what I know not.</div></article></main></body></html>
