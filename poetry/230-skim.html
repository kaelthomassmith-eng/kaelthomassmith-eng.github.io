<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skim — Michael T. Smith</title><link rel="stylesheet" href="../style.css"></head><body><nav class="site-nav"><div class="wrap nav"><div class="brand">Michael T. Smith</div><div><a href="../index.html">Poetry</a></div></div></nav><main class="wrap"><article class="poem"><div class="eyebrow">Poem 230 of 291</div><h2>Skim</h2><div class="meta">Published in Edify Fiction in 2017</div><div class="poemtext">Your skin is a brailed secret message --

every contour and every oscillation

a lake for my water-skiing fingertip,

scooping up a dollop of whipped-cream.</div></article></main></body></html>
