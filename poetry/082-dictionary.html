<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dictionary — Michael T. Smith</title><link rel="stylesheet" href="../style.css"></head><body><nav class="site-nav"><div class="wrap nav"><div class="brand">Michael T. Smith</div><div><a href="../index.html">Poetry</a></div></div></nav><main class="wrap"><article class="poem"><div class="eyebrow">Poem 82 of 291</div><h2>Dictionary</h2><div class="meta">Published by Quotidian Bagatelle in 2026</div><div class="poemtext">I got lost in a dictionary,

looking for words so ancient

they can communicate

the emotions that wash over me.


Can this book contain my mind?

Can I?</div></article></main></body></html>
