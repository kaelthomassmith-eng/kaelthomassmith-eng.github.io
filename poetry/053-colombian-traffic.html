<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colombian Traffic — Michael T. Smith</title><link rel="stylesheet" href="../style.css"></head><body><nav class="site-nav"><div class="wrap nav"><div class="brand">Michael T. Smith</div><div><a href="../index.html">Poetry</a></div></div></nav><main class="wrap"><article class="poem"><div class="eyebrow">Poem 53 of 291</div><h2>Colombian Traffic</h2><div class="meta">Published in Bronze Bird Review in 2025 (or 2026).</div><div class="poemtext">Colombian traffic is like a traumatic thought

that never leaves the mind

but clogs the works, by pushing against

other thoughts – bumper

to bumper,

over and

over.</div></article></main></body></html>
