<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>When… — Michael T. Smith</title><link rel="stylesheet" href="../style.css"></head><body><nav class="site-nav"><div class="wrap nav"><div class="brand">Michael T. Smith</div><div><a href="../index.html">Poetry</a></div></div></nav><main class="wrap"><article class="poem"><div class="eyebrow">Poem 280 of 291</div><h2>When…</h2><div class="meta">Published in Artvilla, poetry life and times in 2018 / Republished in Ink Pantry around 2018</div><div class="poemtext">When every word you’ve used
