<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How Terrifying — Michael T. Smith</title><link rel="stylesheet" href="../style.css"><style>.poem-page{max-width:920px;margin:auto;padding:48px 28px 90px}.poem-page h1{font-size:32px;line-height:1.15;margin:.2em 0 10px}.meta{color:var(--muted);font:14px/1.45 Arial,sans-serif;margin-bottom:8px}.meta-links{margin:10px 0 30px;font:14px/1.45 Arial,sans-serif}.meta-links a{color:var(--green)}.poemtext{font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.58}.src-line{white-space:pre-wrap}.highlight{color:#000 !important}</style></head><body><nav class="site-nav"><div class="wrap nav"><div class="brand">Michael Thomas Smith</div><div><a href="../poetry.html">Poetry</a></div></div></nav><main class="poem-page"><div class="eyebrow">Poem 144</div><h1><span style="font-weight:700">How Terrifying</span></h1><div class="meta"><div>*Published in Artvilla, poetry life and times in 2018</div><div>*Republished Ink Pantry in 2018ish</div></div><div class="poemtext"><div class="src-line" style="margin-bottom:13.33px;line-height:1.150">How terrifying death is</div><div class="src-line" style="margin-bottom:13.33px;line-height:1.150">in the middle of a thought.</div><div class="src-line" style="margin-bottom:13.33px;line-height:1.150">My eyes wanted to slam shut</div><div class="src-line" style="margin-bottom:13.33px;line-height:1.150">such that they could defend</div><div class="src-line" style="margin-bottom:13.33px;line-height:1.150">against what I know not.</div><div class="src-line" style="margin-bottom:13.33px;line-height:1.150">&nbsp;</div><div class="src-line" style="margin-bottom:13.33px;line-height:1.150">&nbsp;</div><div class="src-line" style="margin-bottom:13.33px;line-height:1.150">&nbsp;</div></div><p style="margin-top:42px"><a href="../poetry.html">← Back to Poetry</a></p></main></body></html>
