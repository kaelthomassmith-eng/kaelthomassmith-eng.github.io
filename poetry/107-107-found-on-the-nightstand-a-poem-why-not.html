margin-bottom:0.0px;line-height:1.000">&nbsp;</div><div class="src-line" style="margin-bottom:0.0px;line-height:1.500">&nbsp;</div></div><p style="margin-top:42px"><a href="../poetry.html">← Back to Poetry</a></p></main></body></html>
