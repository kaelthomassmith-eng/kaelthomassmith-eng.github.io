<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rat Race — Michael T. Smith</title><link rel="stylesheet" href="../style.css"></head><body><nav class="site-nav"><div class="wrap nav"><div class="brand">Michael T. Smith</div><div><a href="../index.html">Poetry</a></div></div></nav><main class="wrap"><article class="poem"><div class="eyebrow">Poem 213 of 291</div><h2>Rat Race</h2><div class="meta">Published in Shot Glass in 2018</div><div class="poemtext">If there’s light at the end of the tunnel

and the rat race can all run towards it,

then I want to see the shadows it casts

in the dying words of those that don’t last.</div></article></main></body></html>
