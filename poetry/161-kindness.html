<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindness — Michael T. Smith</title><link rel="stylesheet" href="../style.css"></head><body><nav class="site-nav"><div class="wrap nav"><div class="brand">Michael T. Smith</div><div><a href="../index.html">Poetry</a></div></div></nav><main class="wrap"><article class="poem"><div class="eyebrow">Poem 161 of 291</div><h2>Kindness</h2><div class="meta">Published in Artvilla, poetry life and times in 2019.; Republished in Ink Pantry around 2019.</div><div class="poemtext">Sometimes human kindness
