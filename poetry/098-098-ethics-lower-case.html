<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ethics (lower case) — Michael T. Smith</title><link rel="stylesheet" href="../style.css"><style>.poem-page{max-width:920px;margin:auto;padding:48px 28px 90px}.poem-page h1{font-size:32px;line-height:1.15;margin:.2em 0 10px}.meta{color:var(--muted);font:14px/1.45 Arial,sans-serif;margin-bottom:8px}.meta-links{margin:10px 0 30px;font:14px/1.45 Arial,sans-serif}.meta-links a{color:var(--green)}.poemtext{font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.58}.src-line{white-space:pre-wrap}.highlight{color:#000 !important}</style></head><body><nav class="site-nav"><div class="wrap nav"><div class="brand">Michael Thomas Smith</div><div><a href="../poetry.html">Poetry</a></div></div></nav><main class="poem-page"><div class="eyebrow">Poem 98</div><h1><span style="font-weight:700;font-style:italic">ethics (lower case)</span></h1><div class="meta"><div>*Published in Zombie Logic Review sometime between 2014-2017</div></div><div class="poemtext"><div class="src-line" style="line-height:1.900">the wrot uf ethics is not on a black(bored)</div><div class="src-line" style="line-height:1.900">butt is the dustk of chack- after-wards</div><div class="src-line" style="line-height:1.900">it’s a hand-hold, post-morden </div><div class="src-line" style="line-height:1.900">like a dumball matching out on service</div><div class="src-line" style="">&nbsp;</div></div><p style="margin-top:42px"><a href="../poetry.html">← Back to Poetry</a></p></main></body></html>
