<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyscraper — Michael T. Smith</title><link rel="stylesheet" href="../style.css"></head><body><nav class="site-nav"><div class="wrap nav"><div class="brand">Michael T. Smith</div><div><a href="../index.html">Poetry</a></div></div></nav><main class="wrap"><article class="poem"><div class="eyebrow">Poem 231 of 291</div><h2>Skyscraper</h2><div class="meta">Published in Futures Trading in 2013?</div><div class="poemtext">Cold height

Digging in the loose soil

Of a lost story -

The Titans of nothing

To block the morning sun

In the shadow of a shadow:

Man.</div></article></main></body></html>
